server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-store" always;
    location = / { try_files /index.html =404; }
    location = /demo.html { try_files /demo.html =404; }
    location = /health { access_log off; default_type text/plain; return 200 "demo-ok; trial-disabled"; }
    location = /up { try_files /__not_a_file__ @laravel; }
    location = /assessor/avaliacao { try_files /__not_a_file__ @laravel; }
    location ~ "^/assessor/avaliacao/[a-f0-9]{32}/cancelar$" { try_files /__not_a_file__ @laravel; }
    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass assessor_app:9000;
        fastcgi_read_timeout 30s;
    }
    # Admin, billing, AI and publication endpoints deliberately absent in this staging shell.
    location / { return 404; }
}
