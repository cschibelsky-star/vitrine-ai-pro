server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 20M;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $php_fpm_upstream cockpit_app:9000;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        # HML fallback: inject the canonical VIA while cockpit_app still runs the previous image.
        # The dashboard Blade integration remains the long-term source of truth.
        sub_filter_once on;
        sub_filter "</body>" "<script>(function(){if(document.getElementById('via-widget-frame'))return;var f=document.createElement('iframe');f.id='via-widget-frame';f.title='VIA - Assistente Virtual';f.allow='microphone; autoplay';f.src='https://via.vitrineiapro.com.br/?embed=1&hostOrigin='+encodeURIComponent(location.origin)+'&viaProject=cockpit&viaModule=dashboard';f.setAttribute('aria-label','VIA - Assistente Virtual da Vitrine IA Pro');f.style.cssText='position:fixed;right:0;bottom:0;width:min(460px,100vw);height:min(760px,100dvh);max-width:100vw;max-height:100dvh;border:0;background:transparent;z-index:2147483000;pointer-events:auto';document.body.appendChild(f);})();</script></body>";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
