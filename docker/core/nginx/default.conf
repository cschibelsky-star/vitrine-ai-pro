server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # Docker embedded DNS. Using a variable in fastcgi_pass forces Nginx to
    # re-resolve the PHP-FPM service instead of pinning the container IP that
    # existed when Nginx started.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $php_fpm_upstream core_app:9000;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
