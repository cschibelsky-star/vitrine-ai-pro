<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2d">
  <title>Conheça Sumaré — sem conexão</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b3d2d;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(520px,calc(100% - 40px));text-align:center}
    .mark{width:72px;height:72px;margin:0 auto 24px;border-radius:22px;display:grid;place-items:center;background:#fff;color:#0b3d2d;font-weight:800;font-size:22px}
    h1{font-size:28px;margin:0 0 12px}
    p{line-height:1.6;opacity:.86}
    button{margin-top:18px;border:0;border-radius:999px;padding:14px 22px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="mark">CS</div>
    <h1>Você está sem conexão</h1>
    <p>O Conheça Sumaré continua disponível com o conteúdo que já foi carregado. Reconecte-se para atualizar lugares, agenda e informações da cidade.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
