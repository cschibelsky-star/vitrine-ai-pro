services:
  generate:
    image: python:3.12-slim
    restart: 'no'
    working_dir: /workspace
    env_file:
      - ../.env.runtime
    volumes:
      - ./tools:/workspace/tools:ro
      - ./docs/vitrine/gemini-home-lab-execution.md:/workspace/brief.md:ro
      - ../generated-home:/workspace/output
    command:
      - python
      - tools/home_lab_gemini_client.py
      - --brief
      - /workspace/brief.md
      - --output
      - /workspace/output
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
