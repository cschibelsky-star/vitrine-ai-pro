services:
  vitrine_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: vitrine_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - vitrine_net

  vitrine_web:
    image: nginx:stable
    container_name: vitrine_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - vitrine_app
    networks:
      - vitrine_net

networks:
  vitrine_net:
    external: true
