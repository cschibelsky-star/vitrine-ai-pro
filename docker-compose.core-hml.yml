services:
  marketing_db:
    image: mariadb:11.4
    container_name: vitrine_marketing_db_hml
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: vitrine_marketing_hml
      MARIADB_USER: vitrine_marketing
      MARIADB_PASSWORD: "VitrineMarketingHml_2026_8f3a91"
      MARIADB_ROOT_PASSWORD: "VitrineMarketingRootHml_2026_b7c42e"
    volumes:
      - marketing_db_hml:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vitrine_net

  marketing_app:
    image: vitrine-marketing-agents-core-hml-app:latest
    build:
      context: .
      dockerfile: docker/core/php/Dockerfile
    container_name: vitrine_marketing_app_hml
    restart: unless-stopped
    working_dir: /var/www/html
    command: php-fpm
    env_file:
      - ../.env.runtime
    environment:
      APP_NAME: "Vitrine Marketing IA HML"
      APP_ENV: homologation
      APP_DEBUG: "false"
      APP_KEY: "base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      DB_CONNECTION: mysql
      DB_HOST: marketing_db
      DB_PORT: 3306
      DB_DATABASE: vitrine_marketing_hml
      DB_USERNAME: vitrine_marketing
      DB_PASSWORD: "VitrineMarketingHml_2026_8f3a91"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - marketing_storage_hml:/var/www/html/storage
    depends_on:
      marketing_db:
        condition: service_healthy
    networks:
      - vitrine_net

  marketing_validate:
    image: vitrine-marketing-agents-core-hml-app:latest
    pull_policy: never
    container_name: vitrine_marketing_validate_hml
    restart: "no"
    working_dir: /var/www/html
    env_file:
      - ../.env.runtime
    environment:
      APP_NAME: "Vitrine Marketing IA HML"
      APP_ENV: homologation
      APP_DEBUG: "false"
      APP_KEY: "base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      DB_CONNECTION: mysql
      DB_HOST: marketing_db
      DB_PORT: 3306
      DB_DATABASE: vitrine_marketing_hml
      DB_USERNAME: vitrine_marketing
      DB_PASSWORD: "VitrineMarketingHml_2026_8f3a91"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    command:
      - sh
      - -lc
      - |
        set -eu
        rm -f /evidence/result.json /evidence/run.txt /evidence/exit.json
        exec > /evidence/run.txt 2>&1
        trap 'code=$$?; printf "{\"exit_code\":%s}\n" "$$code" > /evidence/exit.json' EXIT
        echo "[1/5] lint"
        php -l app/Services/Ai/AiExecutionService.php
        php -l app/Services/Ai/AiRoutingService.php
        php -l app/Services/Ai/AiMediaGenerationService.php
        php -l app/Models/AiMediaGeneration.php
        php -l database/migrations/2026_09_01_211700_create_ai_media_generations_table.php
        echo "[2/5] media migration"
        php artisan migrate --path=database/migrations/2026_09_01_211700_create_ai_media_generations_table.php --force
        php artisan db:seed --class=AiProviderSeeder --force
        php artisan db:seed --class=AiAgentSeeder --force
        php -r '
        require "vendor/autoload.php";
        $$app = require "bootstrap/app.php";
        $$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
        $$agent = App\Models\AiAgent::query()->where("slug", "marketing-ia")->firstOrFail();
        $$router = $$app->make(App\Services\Ai\AiRoutingService::class);
        $$textResult = $$router->execute($$agent, "Crie uma chamada curta de marketing para a Vitrine IA Pro. Responda em uma frase.", "copy");
        $$textOutput = is_string($$textResult->output) ? trim($$textResult->output) : json_encode($$textResult->output, JSON_UNESCAPED_UNICODE);
        $$textOk = $$textResult->status === "Concluído" && $$textOutput !== "";
        $$textModel = $$textResult->model_name ?: data_get($$textResult->metadata, "model_name");
        $$evidence = [
            "ok" => $$textOk,
            "text_ok" => $$textOk,
            "text_status" => $$textResult->status,
            "text_model" => $$textModel,
            "text_provider_id" => $$textResult->ai_provider_id,
            "text_output_nonempty" => $$textOutput !== "",
            "text_output" => mb_substr($$textOutput, 0, 1200),
            "paid_image_e2e" => "disabled_by_default",
            "paid_image_reason" => "Nano Banana API requires paid billing; run separately when billing is enabled.",
        ];
        file_put_contents("/evidence/result.json", json_encode($$evidence, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE));
        exit($$evidence["ok"] ? 0 : 2);
        '
    volumes:
      - marketing_storage_hml:/var/www/html/storage
      - ./storage/app/marketing-e2e:/evidence
    depends_on:
      marketing_db:
        condition: service_healthy
    networks:
      - vitrine_net

volumes:
  marketing_db_hml:
  marketing_storage_hml:

networks:
  vitrine_net:
    external: true
