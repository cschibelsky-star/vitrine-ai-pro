services:
  assessor_app:
    build:
      context: .
      dockerfile: docker/assessor/php/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: hml
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      ASSESSOR_TRIAL_HML_ENABLED: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/assessor/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    volumes:
      - assessor_private:/var/lib/assessor
      - assessor_storage:/var/www/html/storage
    networks: [assessor_internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
  assessor_web:
    image: nginx:1.27-alpine
    user: "101:101"
    restart: unless-stopped
    read_only: true
    depends_on: [assessor_app]
    ports: ["127.0.0.1:18782:8080"]
    volumes:
      - ./hml/assessor:/usr/share/nginx/html:ro
      - ./docker/assessor/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    networks: [assessor_internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
networks:
  assessor_internal:
    internal: true
volumes:
  assessor_private:
  assessor_storage:
