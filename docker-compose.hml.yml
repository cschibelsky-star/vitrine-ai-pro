services:
  web:
    build:
      context: .
    container_name: conheca_sumare_hml_web
    restart: unless-stopped
    volumes:
      - ./storage/data:/var/www/html/storage/data
    command: ["sh", "-c", "chown -R www-data:www-data /var/www/html/storage/data && exec apache2-foreground"]
    env_file:
      - ../.env.runtime
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-traefik_app_network"
      - 'traefik.http.routers.conheca-sumare-hml.rule=Host(`conheca-sumare-hml.vitrineaipro.com.br`)'
      - "traefik.http.routers.conheca-sumare-hml.entrypoints=websecure"
      - "traefik.http.routers.conheca-sumare-hml.tls=true"
      - "traefik.http.routers.conheca-sumare-hml.tls.certresolver=le"
      - "traefik.http.routers.conheca-sumare-hml.service=conheca-sumare"
      - 'traefik.http.routers.conheca-sumare-public.rule=Host(`conhecasumare.com.br`) || Host(`www.conhecasumare.com.br`)'
      - "traefik.http.routers.conheca-sumare-public.entrypoints=websecure"
      - "traefik.http.routers.conheca-sumare-public.tls=true"
      - "traefik.http.routers.conheca-sumare-public.tls.certresolver=le"
      - "traefik.http.routers.conheca-sumare-public.service=conheca-sumare"
      - "traefik.http.services.conheca-sumare.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: n8n-traefik_app_network
