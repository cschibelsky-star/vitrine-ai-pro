services:
  web:
    build:
      context: .
    container_name: conheca_sumare_hml_web
    restart: unless-stopped
    env_file:
      - ../.env.runtime
    environment:
      EVENTS_DATA_DIR: /var/www/html/storage/calendar
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-traefik_app_network"
      - 'traefik.http.routers.conheca-sumare-hml.rule=Host(`conheca-sumare-hml.vitrineaipro.com.br`)'
      - "traefik.http.routers.conheca-sumare-hml.entrypoints=websecure"
      - "traefik.http.routers.conheca-sumare-hml.tls=true"
      - "traefik.http.routers.conheca-sumare-hml.tls.certresolver=le"
      - "traefik.http.routers.conheca-sumare-hml.service=conheca-sumare"
      - "traefik.http.services.conheca-sumare.loadbalancer.server.port=80"
    volumes:
      - conheca_sumare_data:/var/www/html/storage/data
      - conheca_sumare_calendar:/var/www/html/storage/calendar
      - conheca_sumare_image_cache:/var/www/html/storage/image-cache
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: n8n-traefik_app_network

volumes:
  conheca_sumare_data:
    name: conheca_sumare_data
  conheca_sumare_calendar:
    name: conheca_sumare_calendar_hml
  conheca_sumare_image_cache:
    name: conheca_sumare_image_cache_hml
