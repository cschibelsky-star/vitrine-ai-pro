name: Vitrine public recovery diagnostics
on:
  push:
    branches: [fix/vitrine-public-recovery-20261014]
    paths: [.github/workflows/vitrine-public-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public DNS and HTTPS evidence
        shell: python
        run: |
          import socket, urllib.request, urllib.error, ssl, re, json
          for host in ["vitrineaipro.com.br", "www.vitrineaipro.com.br", "vitrineiapro.com.br", "www.vitrineiapro.com.br"]:
              result = {"host": host}
              try:
                  result["addresses"] = sorted({entry[4][0] for entry in socket.getaddrinfo(host, 443)})
              except Exception as exc:
                  result["dns_error"] = str(exc)
              for scheme in ["https", "http"]:
                  try:
                      req = urllib.request.Request(scheme + "://" + host + "/", headers={"User-Agent": "Vitrine-Recovery-Audit/1.0"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          page = response.read(200000).decode("utf-8", errors="replace")
                          titles = re.findall(r"<title[^>]*>(.*?)</title>", page, re.I|re.S)
                          result[scheme] = {"status": response.status, "url": response.url, "server": response.headers.get("Server"), "title": titles[:1], "bytes_read": len(page), "contains_vitrine": "vitrine" in page.lower()}
                  except Exception as exc:
                      result[scheme] = {"error": str(exc)}
              print(json.dumps(result, ensure_ascii=False))
