name: VOX HML manual voice benchmark
on:
  workflow_dispatch:
    inputs:
      piper_voice:
        description: 'Piper Brazilian voice for HML testing'
        type: choice
        required: true
        default: pt_BR-cadu-medium
        options:
          - pt_BR-cadu-medium
          - pt_BR-faber-medium
          - pt_BR-jeff-medium
          - pt_BR-edresson-low
permissions:
  contents: read
concurrency:
  group: vox-hml-manual
  cancel-in-progress: false
jobs:
  vox-ptbr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify VOX release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vox-hml/bin" "$RUNNER_TEMP/vox-hml/output"
          cd "$RUNNER_TEMP/vox-hml"
          ASSET=vox-x86_64-unknown-linux-gnu.tar.gz
          gh release download v0.17.1 --repo rtk-ai/vox --pattern "$ASSET" --clobber
          DIGEST="$(gh api repos/rtk-ai/vox/releases/tags/v0.17.1 --jq '.assets[] | select(.name=="vox-x86_64-unknown-linux-gnu.tar.gz") | .digest')"
          test -n "$DIGEST" && test "$DIGEST" != null
          test "${DIGEST#sha256:}" != "$DIGEST"
          echo "${DIGEST#sha256:}  $ASSET" | sha256sum -c -
          tar -tzf "$ASSET" > inventory.txt
          mkdir unpacked
          tar -xzf "$ASSET" -C unpacked
          BIN="$(find unpacked -type f -name vox -print -quit)"
          test -n "$BIN"
          install -m 0755 "$BIN" bin/vox
          bin/vox --version
          echo "Verified release SHA256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "$RUNNER_TEMP/vox-hml/bin" >> "$GITHUB_PATH"
      - name: Generate three Portuguese test WAV files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vox-hml/output"
          export VOX_TIMINGS=1
          VOICE='${{ inputs.piper_voice }}'
          echo "Testing Piper voice: $VOICE" >> "$GITHUB_STEP_SUMMARY"
          timeout 150 vox -b piper -l pt -v "$VOICE" -o tts01.wav "Olá, sou a VIA. Este é um teste de voz em português brasileiro."
          timeout 150 vox -b piper -l pt -v "$VOICE" -o tts02.wav "Hoje é vinte e oito de outubro de dois mil e vinte e seis, em Sumaré, São Paulo."
          timeout 150 vox -b piper -l pt -v "$VOICE" -o tts03.wav "Protocolo quarenta e dois. Atendimento marcado para treze horas e quarenta minutos."
      - name: Validate WAV structure and report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import wave,hashlib
          from os import environ
          root=Path(environ['RUNNER_TEMP'])/'vox-hml/output'
          report=['### VOX HML WAV structural checks','Audio perception and Android playback are NOT validated by this workflow.']
          passed=0
          for name in ['tts01.wav','tts02.wav','tts03.wav']:
              p=root/name
              try:
                  with wave.open(str(p),'rb') as f:
                      sr=f.getframerate(); n=f.getnframes(); ch=f.getnchannels()
                      assert sr>0 and n>0 and ch in (1,2)
                      duration=n/sr
                  digest=hashlib.sha256(p.read_bytes()).hexdigest()
                  report.append(f'- {name}: WAV OK, {duration:.2f}s, {sr} Hz, {ch} channel(s), sha256={digest}')
                  passed+=1
              except Exception as e:
                  report.append(f'- {name}: unavailable/invalid ({type(e).__name__})')
          report.append(f'Structural pass: {passed}/3. No human audio quality rating, STT or Android test performed.')
          with open(environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(report)+'\n')
          if passed!=3:raise SystemExit(3)
          PY

      - name: Export short-lived WAV test artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vox-ptbr-${{ inputs.piper_voice }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vox-hml/output/tts*.wav
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
