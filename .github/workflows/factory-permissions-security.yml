name: Factory permissions security regression
on:
  push:
    branches:
      - 'audit/via-agent-hub-escritorio-virtual-*'
    paths:
      - 'app/Factory/Policies/Concerns/ChecksFactoryPermissions.php'
      - 'tests/security/factory_permissions_probe.php'
      - 'app/Factory/Observer/FactoryObserver.php'
      - 'tests/security/factory_observer_probe.php'
      - 'app/Factory/Observer/FactoryReadOnlyProvider.php'
      - 'tests/security/factory_read_only_provider_probe.php'
      - 'app/Factory/Observer/AuthorizedMissionScope.php'
      - 'app/Factory/Observer/MissionObserverGateway.php'
      - 'tests/security/mission_observer_gateway_probe.php'
      - '.github/workflows/factory-permissions-security.yml'
  pull_request:
    paths:
      - 'app/Factory/Policies/Concerns/ChecksFactoryPermissions.php'
      - 'tests/security/factory_permissions_probe.php'
      - '.github/workflows/factory-permissions-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissions-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Syntax validation
        run: |
          php -l app/Factory/Policies/Concerns/ChecksFactoryPermissions.php
          php -l tests/security/factory_permissions_probe.php
          php -l app/Factory/Observer/FactoryObserver.php
          php -l tests/security/factory_observer_probe.php
          php -l app/Factory/Observer/FactoryReadOnlyProvider.php
          php -l tests/security/factory_read_only_provider_probe.php
          php -l app/Factory/Observer/AuthorizedMissionScope.php
          php -l app/Factory/Observer/MissionObserverGateway.php
          php -l tests/security/mission_observer_gateway_probe.php
      - name: Security regression
        run: |
          php tests/security/factory_permissions_probe.php
          php tests/security/factory_observer_probe.php
          php tests/security/factory_read_only_provider_probe.php
          php tests/security/mission_observer_gateway_probe.php
