name: Assessor Online isolated tests

on:
  pull_request:
    paths:
      - 'app/AssessorOnline/**'
      - 'app/Http/Controllers/AssessorOnline/**'
      - 'resources/views/assessor-online/**'
      - 'routes/assessor_online.php'
      - 'routes/web.php'
      - 'tests/Feature/AssessorOnline/**'
      - 'database/migrations/2026_10_2*'
      - 'composer.*'
      - 'phpunit.xml'
      - '.github/workflows/assessor-online-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assessor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, zip
          coverage: none
          tools: composer:v2
      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          chmod -R u+rwX bootstrap/cache storage
      - name: Install full development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - name: Verify test dependencies
        run: |
          php -r "require 'vendor/autoload.php'; if (!class_exists('Mockery')) {fwrite(STDERR, 'Mockery missing'.PHP_EOL); exit(1);}"
      - name: Run isolated Assessor Online tests
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php vendor/bin/phpunit --testsuite "Assessor Online Core" --display-warnings
