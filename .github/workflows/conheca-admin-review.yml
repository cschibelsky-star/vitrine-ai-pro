name: Conheca Admin Review
on:
  push:
    branches: [feature/conheca-admin-event-review]
  pull_request:
    branches: [deploy/conheca-sumare-hml]
    paths: ['admin/**', 'app/bootstrap.php', 'tests/admin-event-review.php', '.github/workflows/conheca-admin-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          php -l admin/index.php
          php -l admin/login.php
          php -l app/bootstrap.php
      - name: Verify event review behavior
        run: php tests/admin-event-review.php
