name: Connector Preflight Contracts

on:
  pull_request:
    paths:
      - "ops/preflight/**"
      - "tests/test_connector_preflight.py"
      - ".github/workflows/connector-preflight-contracts.yml"
  push:
    branches:
      - feat/orchestrator-preflight-issue-120
    paths:
      - "ops/preflight/**"
      - "tests/test_connector_preflight.py"
      - ".github/workflows/connector-preflight-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q ops/preflight tests/test_connector_preflight.py
      - name: Execute fail-closed preflight contract tests
        run: python -m unittest discover -s tests -p test_connector_preflight.py -v
