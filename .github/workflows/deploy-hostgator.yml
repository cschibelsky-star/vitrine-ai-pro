name: Deploy HostGator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTGATOR_HOST }}
          username: ${{ secrets.HOSTGATOR_USER }}
          port: ${{ secrets.HOSTGATOR_PORT }}
          key: ${{ secrets.HOSTGATOR_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            mkdir -p ~/deploy-backups/vitrine-ai-pro
            tar -czf ~/deploy-backups/vitrine-ai-pro/backup-$(date +%Y%m%d-%H%M%S).tar.gz --exclude=vendor --exclude=node_modules --exclude=storage/logs .
            git pull origin main

            # Etapas Laravel sao opcionais nesta hospedagem.
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader
            fi
            if command -v php >/dev/null 2>&1 && [ -f artisan ]; then
              php artisan migrate --force || true
              php artisan optimize:clear || true
              php artisan optimize || true
            fi

            # Publicacao do dominio principal VITRINE IA PRO
            if [ -d "$HOME/vitrineiapro.com.br" ]; then
              rsync -a --delete \
                --exclude='.git/' \
                --exclude='.env' \
                --exclude='data/' \
                --exclude='storage/' \
                --exclude='vendor/' \
                ./ "$HOME/vitrineiapro.com.br/"
            fi
