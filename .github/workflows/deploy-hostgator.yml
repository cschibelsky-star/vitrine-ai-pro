name: Deploy HostGator

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact SHA approved in the Cockpit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Consume Cockpit authorization before SSH
        env:
          PUBLICATION_CONTROL_URL: ${{ secrets.PUBLICATION_CONTROL_URL }}
          PUBLICATION_EXECUTOR_TOKEN: ${{ secrets.PUBLICATION_EXECUTOR_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: python3 scripts/deploy/consume-approval.py vitrine-site "$TARGET_SHA" hostgator-public-site
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        with:
          envs: TARGET_SHA
          host: ${{ secrets.HOSTGATOR_HOST }}
          username: ${{ secrets.HOSTGATOR_USER }}
          port: ${{ secrets.HOSTGATOR_PORT }}
          key: ${{ secrets.HOSTGATOR_SSH_KEY }}
          script: |
            set -e

            REPO_PATH="${{ secrets.DEPLOY_PATH }}"
            DOCROOT="$HOME/vitrineiapro.com.br"
            BACKUP_ROOT="$HOME/deploy-backups/vitrine-ai-pro"
            STAMP="$(date +%Y%m%d-%H%M%S)"

            test -d "$REPO_PATH" || { echo "DEPLOY_ERROR: repository path missing: $REPO_PATH"; exit 20; }
            test -d "$DOCROOT" || { echo "DEPLOY_ERROR: document root missing: $DOCROOT"; exit 21; }

            case "$TARGET_SHA" in (*[!a-f0-9]*|"") exit 25;; esac
            test "${#TARGET_SHA}" -eq 40 || exit 25
            mkdir -p "$BACKUP_ROOT"

            # Backup restauravel do document root atual antes de publicar.
            tar -czf "$BACKUP_ROOT/document-root-$STAMP.tar.gz" -C "$DOCROOT" .

            # Exact immutable checkout; preserve the existing repository and dirty tree.
            git -C "$REPO_PATH" fetch origin "$TARGET_SHA"
            RELEASE_PATH="$(mktemp -d "$BACKUP_ROOT/release-$STAMP-XXXXXX")"
            git -C "$REPO_PATH" archive "$TARGET_SHA" | tar -x -C "$RELEASE_PATH"
            cd "$RELEASE_PATH"

            # Publicacao explicita: somente camada publica/comercial.
            # Nao usa --delete para preservar .well-known e outros arquivos gerenciados pela hospedagem.
            PUBLIC_FILES="
              .htaccess
              config.php
              index.php
              solucoes.php
              desenvolvimento.php
              tv-digital.php
              news.php
              guia-digital.php
              social-media.php
              governo.php
              demonstracoes.php
              casos-reais.php
              diagnostico.php
              diagnostico-resultado.php
              solicitacao-institucional.php
              salvar-solicitacao.php
              salvar-lead.php
              contratacao-publica.php
              documentos-publicos.php
              lgpd.php
              contato.php
            "

            for file in $PUBLIC_FILES; do
              test -f "$file" || { echo "DEPLOY_ERROR: required public file missing: $file"; exit 22; }
              install -m 0644 "$file" "$DOCROOT/$file"
            done

            for dir in assets includes demos; do
              test -d "$dir" || { echo "DEPLOY_ERROR: required public directory missing: $dir"; exit 23; }
              mkdir -p "$DOCROOT/$dir"
              rsync -a "$dir/" "$DOCROOT/$dir/"
            done

            # Diretório de leads deve permanecer privado/persistente e nunca e substituido pelo deploy.
            mkdir -p "$DOCROOT/data/leads"

            # Verificacao de publicacao: o index no document root deve ser byte-a-byte igual ao index validado no repositorio.
            cmp -s "$RELEASE_PATH/index.php" "$DOCROOT/index.php" \
              || { echo "DEPLOY_ERROR: homepage verification failed"; exit 24; }

            echo "DEPLOY_OK: public document root synchronized safely"
