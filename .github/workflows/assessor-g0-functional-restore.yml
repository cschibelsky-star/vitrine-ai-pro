name: Assessor G0 functional restore

on:
  push:
    branches:
      - feature/assessor-commercial-gates-20261022
    paths:
      - 'tests/Assessor/IsolatedRestoreTest.php'
      - '.github/workflows/assessor-g0-functional-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
          coverage: none
      - name: Prepare Laravel writable directories
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run isolated real-schema restore test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: vendor/bin/phpunit tests/Assessor/IsolatedRestoreTest.php
