name: Factory VIA Observer Handoff Draft
on:
  pull_request:
    paths:
      - 'app/Factory/Quality/Services/FactoryViaObserverHandoffDraft.php'
      - 'tests/safety/factory-via-observer-draft.php'
      - '.github/workflows/factory-via-observer-draft.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint
        run: |
          php -l app/Factory/Quality/Services/FactoryViaObserverHandoffDraft.php
          php -l tests/safety/factory-via-observer-draft.php
      - name: Verify handoff remains pending
        run: php tests/safety/factory-via-observer-draft.php
