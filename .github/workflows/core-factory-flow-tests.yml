name: Core Factory Flow Tests

on:
  push:
    branches:
      - consolidation/core-factory-flow-v1
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: vitrine_ai_pro_test
          MYSQL_USER: vitrine
          MYSQL_PASSWORD: vitrine
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:2lVxQyG8fSYL86jU3A8Wryp54vYyY1KksREZVZ9C+rc=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vitrine_ai_pro_test
      DB_USERNAME: vitrine
      DB_PASSWORD: vitrine
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax for consolidation files
        run: |
          php -l app/Services/FlowWorkflowRegistryService.php
          php -l app/Services/VitrineFlowService.php
          php -l app/Factory/Workflow/Services/FactoryFlowWorkflowPublisher.php
          php -l tests/Unit/FlowWorkflowRegistryServiceTest.php
          php -l tests/Unit/FactoryFlowWorkflowPublisherTest.php
          php -l tests/Feature/VitrineFlowRuntimeFirstTest.php

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Core Factory Flow tests
        run: php artisan test tests/Unit/FlowWorkflowRegistryServiceTest.php tests/Unit/FactoryFlowWorkflowPublisherTest.php tests/Feature/VitrineFlowRuntimeFirstTest.php
