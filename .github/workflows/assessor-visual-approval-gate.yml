name: Assessor Online visual approval gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-approved-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reference approval and SHA-256 integrity
        run: python scripts/check_assessor_visual_baseline.py
      - name: Explain remaining visual check
        if: success()
        run: |
          echo 'Reference integrity verified. This is NOT pixel fidelity approval.'
          echo 'Compare screenshots for desktop and mobile and validate served HML before publication.'
