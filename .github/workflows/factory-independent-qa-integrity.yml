name: Factory Independent QA Integrity Gate
on:
  pull_request:
    paths:
      - 'app/Factory/Quality/Services/IndependentArtifactIntegrityGate.php'
      - 'tests/safety/factory-independent-qa-integrity.php'
      - '.github/workflows/factory-independent-qa-integrity.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint
        run: |
          php -l app/Factory/Quality/Services/IndependentArtifactIntegrityGate.php
          php -l tests/safety/factory-independent-qa-integrity.php
      - name: Integrity fail-closed scenarios
        run: php tests/safety/factory-independent-qa-integrity.php
