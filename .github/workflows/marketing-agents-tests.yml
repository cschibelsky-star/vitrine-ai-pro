name: Marketing Agents Core Tests

on:
  push:
    branches:
      - feature/marketing-agents-core-v1
  pull_request:
    paths:
      - 'app/Marketing/**'
      - 'database/migrations/*_marketing_*_table.php'
      - 'resources/schemas/marketing/**'
      - 'tests/Unit/Marketing/**'
      - 'tests/Fixtures/Marketing/**'
      - 'tools/marketing/**'
      - 'docs/marketing/**'
      - 'tests/TestCase.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/marketing-agents-tests.yml'

permissions:
  contents: read

jobs:
  marketing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Prepare Laravel cache paths
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Marketing Agents tests
        run: vendor/bin/phpunit tests/Unit/Marketing --colors=never

    - name: Verify VIA OBSERVER pilot stays blocked without independent review
      run: |
        set +e
        php tools/marketing/verify-autonomous-handoff.php tests/Fixtures/Marketing/handoff_via_observer_blocked.json > /tmp/marketing-handoff-observer.json
        status=$?
        set -e
        test "$status" -eq 1
        grep -q '"decision": "blocked"' /tmp/marketing-handoff-observer.json
        grep -q '"can_advance": false' /tmp/marketing-handoff-observer.json
        grep -q 'independent review missing or invalid' /tmp/marketing-handoff-observer.json
