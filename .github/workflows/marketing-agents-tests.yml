name: Marketing Agents Core Tests

on:
  push:
    branches:
      - feature/marketing-agents-core-v1
  pull_request:
    paths:
      - 'app/Marketing/**'
      - 'database/migrations/*_marketing_*_table.php'
      - 'resources/schemas/marketing/**'
      - 'tests/Unit/Marketing/**'
      - 'tests/TestCase.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

jobs:
  marketing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Marketing Agents tests
        run: vendor/bin/phpunit tests/Unit/Marketing --colors=never
