name: Assessor G0 synthetic restore

on:
  push:
    branches:
      - feature/assessor-commercial-gates-20261022
    paths:
      - 'scripts/assessor/g0-synthetic-restore-drill.py'
      - '.github/workflows/assessor-g0-synthetic-restore.yml'
      - 'tests/Assessor/IsolatedRestoreTest.php'
      - 'tests/Assessor/IsolatedRestoreTest.php'
  pull_request:
    paths:
      - 'scripts/assessor/g0-synthetic-restore-drill.py'
      - '.github/workflows/assessor-g0-synthetic-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Verify isolated synthetic backup and restore
        run: python3 scripts/assessor/g0-synthetic-restore-drill.py

  functional-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
          coverage: none
      - name: Prepare Laravel writable directories
        run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Verify functional restore against actual trial schema
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: vendor/bin/phpunit tests/Assessor/IsolatedRestoreTest.php
