name: Cockpit Centro IA PR122 - Authorization

on:
  push:
    branches:
      - feature/cockpit-assessor-online-hml
    paths:
      - 'tests/Feature/CockpitCentroIaAuthorizationTest.php'
      - 'routes/cockpit.php'
      - 'resources/views/cockpit/centro-ia-gallery.blade.php'
      - 'app/Models/User.php'
      - 'phpunit.xml'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/cockpit-centro-ia-authorization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    name: Isolated Laravel authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, fileinfo, gd, zip, bcmath
          coverage: none

      - name: Prepare Laravel cache paths
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate test syntax
        run: php -l tests/Feature/CockpitCentroIaAuthorizationTest.php

      - name: Run isolated access-control tests
        run: vendor/bin/phpunit tests/Feature/CockpitCentroIaAuthorizationTest.php --colors=never
