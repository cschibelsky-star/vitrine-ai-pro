name: API Lab isolated tests
on:
  pull_request:
    paths:
      - 'tools/api-lab/**'
      - '.github/workflows/api-lab.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
        working-directory: tools/api-lab
