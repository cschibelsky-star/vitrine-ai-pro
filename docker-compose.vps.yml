services:
  web:
    image: php:8.3-apache
    container_name: vitrine_commercial_sales_web
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:ro
    ports:
      - "127.0.0.1:18081:80"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$r=@file_get_contents(\"http://127.0.0.1/health.php\"); exit($$r && strpos($$r,\"\\\"ok\\\":true\")!==false ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
